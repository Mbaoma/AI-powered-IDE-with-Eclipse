# Builds the Phase 2 image and pushes it to Artifact Registry.

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -f
      - config/docker/Dockerfile
      - -t
      - "${_IMAGE}:${_TAG}"
      - -t
      - "${_IMAGE}:latest"
      - .

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_IMAGE}:${_TAG}"]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_IMAGE}:latest"]

images:
  - "${_IMAGE}:${_TAG}"
  - "${_IMAGE}:latest"

substitutions:
  _IMAGE: "REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/theia-ai-ide"
  _TAG: "manual"

timeout: 2400s

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY
